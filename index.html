<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src https://*.supabase.co wss://*.supabase.co; form-action 'none'; base-uri 'none'">
<title>Painel TribunaOnline.org</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6573; --border: #dde1e7;
    --primary: #1f5fbf; --on-primary: #ffffff; --ok: #1d7a46; --bad: #b3261e; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111317; --card: #1a1d23; --text: #eceef2; --muted: #9aa3b1; --border: #2c313a;
      --primary: #7fb0ff; --on-primary: #0d1117; --ok: #5fd08f; --bad: #ff8a80; --chip: #242932;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }
  button.ok { background: var(--ok); border-color: var(--ok); color: var(--on-primary); font-weight: 600; }
  button.bad { color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .login { max-width: 360px; margin: 60px auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 2px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 18px; margin: 12px 0; }
  .grid div span { display: block; font-size: 12px; color: var(--muted); }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; margin-left: 6px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; margin-top: 8px; }
  .actions textarea { flex: 1 1 260px; min-height: 40px; }
  .msg { padding: 10px 14px; border-radius: 10px; background: var(--chip); margin-bottom: 14px; }
  .empty { text-align: center; padding: 40px 0; color: var(--muted); }
  a { color: var(--primary); word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>Painel TribunaOnline.org · Candidaturas</h1>
  <span id="who" class="muted"></span>
  <button id="logout" hidden>Sair</button>
</header>
<main id="app"></main>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
